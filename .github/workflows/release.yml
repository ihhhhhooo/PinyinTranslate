name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One publisher at a time. A pushed tag is immutable; reruns cannot overwrite it.
concurrency:
  group: pinyintranslate-release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    if: github.repository == 'ihhhhhooo/trans'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      output_name: ${{ steps.version.outputs.output_name }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the stable tag and centralized versions
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/release.ps1 -Tag $env:RELEASE_TAG -ValidateConfigurationOnly
          $outputName = 'PinyinTranslate-' + $env:RELEASE_TAG.Replace('.', '-') + '-win-x64'
          "output_name=$outputName" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install the .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Run only the reviewed headless test inventory
        run: ./scripts/test.ps1 -HeadlessOnly

      - name: Build the self-contained installer and portable release
        env:
          OUTPUT_NAME: ${{ steps.version.outputs.output_name }}
        run: ./scripts/package.ps1 -Velopack -OutputName $env:OUTPUT_NAME

      - name: Verify all release assets without running any application
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          OUTPUT_NAME: ${{ steps.version.outputs.output_name }}
        run: |
          $directory = Join-Path 'artifacts' ($env:OUTPUT_NAME + '-Releases')
          ./scripts/release.ps1 -Tag $env:RELEASE_TAG -PackagedDir $directory

      - name: Retain the exact verified assets for the publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: artifacts/${{ steps.version.outputs.output_name }}-Releases/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the same immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the .NET 10 SDK for the pinned local vpk tool
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Retrieve only this workflow run's verified assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: artifacts/release

      - name: Verify, upload the draft, then publish
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/release.ps1 -Tag $env:RELEASE_TAG -PackagedDir artifacts/release -Publish
